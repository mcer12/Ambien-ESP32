[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_framework = unity
lib_deps =
    zinggjm/GxEPD2
    sparkfun/SparkFun SCD4x Arduino Library@^1.1.2
    https://github.com/Sensirion/arduino-i2c-sht3x.git
    bblanchon/ArduinoJson@^7.2.1
    https://github.com/mcer12/PixelFonts
    knolleary/PubSubClient@^2.8

; Unit tests of lib/ on the PC (needs gcc): pio test -e native
; On Windows without gcc, run them in Docker: see AGENTS.md "Tests"
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
